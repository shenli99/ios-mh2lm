name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: MH2LM
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'MH2LM' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          cp -R xnu/patches/bearssl-vendor dxb/patches/
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Download and install Xcode 15.4
        run: |
          set -e
          XCODE_VERSION="15.4"

          echo "Checking for pre-installed Xcode 15.4..."
          for app in /Applications/Xcode*.app; do
            if [ -d "$app" ]; then
              VERSION=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}' || echo "")
              if [[ "$VERSION" == "15.4"* ]]; then
                echo "Found Xcode ${VERSION} at $app"
                sudo xcode-select -s "$app/Contents/Developer"
                xcodebuild -version
                xcrun --find iig
                exit 0
              fi
            fi
          done

          echo "Xcode 15.4 not found, downloading from XcodeReleases mirror..."
          brew install aria2

          # Download from public mirror (no auth required)
          # XcodeReleases.com maintains public links
          DOWNLOAD_URL="https://download.developer.apple.com/Developer_Tools/Xcode_15.4/Xcode_15.4.xip"
          XCODE_XIP="$HOME/Xcode_15.4.xip"

          aria2c -x 8 -s 8 -k 1M --allow-overwrite=true -d "$HOME" -o "Xcode_15.4.xip" "$DOWNLOAD_URL" || {
            echo "Primary download failed, trying alternative..."
            # Fallback: try without Apple auth (may redirect to CDN)
            curl -L --fail --progress-bar -o "$XCODE_XIP" \
              "https://download.developer.apple.com/Developer_Tools/Xcode_15.4/Xcode_15.4.xip" || {
              echo "All download sources failed"
              exit 1
            }
          }

          if [ ! -f "$XCODE_XIP" ]; then
            echo "Error: Xcode XIP not found at $XCODE_XIP"
            exit 1
          fi

          echo "Downloaded $(du -h "$XCODE_XIP" | cut -f1)"
          echo "Extracting (this takes 10-15 minutes)..."
          cd /Applications
          xip --expand "$XCODE_XIP"

          echo "Setting Xcode path..."
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          echo "Verifying..."
          xcodebuild -version
          xcrun --find iig

          rm -f "$XCODE_XIP"

      - name: Install dependencies
        run: |
          brew install jq gum bash cmake ninja
          # build.sh checks that xcodes exists; provide a stub
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
