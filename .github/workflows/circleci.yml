version: 2.1

# ── 可通过 API 或手动触发时传入的 pipeline 参数（对应 workflow_dispatch inputs）──
parameters:
  macos_version:
    type: string
    default: "13.5"
  kernel_config:
    type: string
    default: "DEVELOPMENT"
  machine_config:
    type: string
    default: "MH2LM"
  keep_going:
    type: boolean
    default: true

jobs:
  build:
    macos:
      xcode: 15.4.0   # 对应 GitHub Actions 的 macos-14 (Xcode 15.x)
                       # 如需其他版本请参考支持列表
    resource_class: m4pro.medium
    # timeout-minutes: 120 → CircleCI 默认超时为 10 分钟，可在 Project Settings 中调整
    environment:
      DXB_REPO: https://github.com/blacktop/darwin-xnu-build
      DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
      MACOS_VERSION: << pipeline.parameters.macos_version >>
      KERNEL_CONFIG: << pipeline.parameters.kernel_config >>
      MACHINE_CONFIG: << pipeline.parameters.machine_config >>

    steps:
      - checkout   # 对应 actions/checkout@v4

      - run:
          name: Fetch build script
          command: |
            git init -q dxb
            git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
            git -C dxb checkout -q FETCH_HEAD
            cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
            cp -R xnu/patches/bearssl-vendor dxb/patches/
            sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
            grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
            ls dxb/patches

      - run:
          name: Deps
          command: |
            brew install jq gum bash cmake ninja
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
            sudo chmod +x /usr/local/bin/xcodes
            sw_vers
            ls -d /Applications/Xcode*.app
            XC=$(ls -d /Applications/Xcode-*.app | sort -V | head -1)
            echo "export DEVELOPER_DIR=$XC/Contents/Developer" >> $BASH_ENV
            sudo xcode-select -s "$XC"
            xcodebuild -version
            xcrun --find iig

      - run:
          name: Build
          working_directory: dxb
          command: |
            # 对应 inputs.keep_going；pipeline 参数为 boolean
            if [ "<< pipeline.parameters.keep_going >>" = "true" ]; then
              export MAKEFLAGS="-k"
            fi
            set -o pipefail
            bash build.sh 2>&1 | tee ../build.log
            # dxb treats a rejected patch as a warning. Require the source
            # markers before accepting the kernel artifact.
            if [ ! -f xnu/bsd/dev/sweet_log_level.h ]; then
              echo 'ERROR: 0140 log level header missing from built XNU source' >&2
              exit 1
            fi
            require_marker() {
              if ! grep -Fq "$2" "$1"; then
                echo "ERROR: required 0139..0154 marker missing from $1: $2" >&2
                exit 1
              fi
            }
            require_marker xnu/iokit/Kernel/arm/SweetPmicKeys.cpp 'SWEET KEYS IRQ: three routes active; IRQ-only'
            require_marker xnu/iokit/Kernel/arm/SweetPmicKeys.cpp 'SWEET KEYS IRQ: preparing backend on consumer workloop before attach'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiMuxClient.cpp 'if (prepare && !prepare(context))'
            require_marker xnu/bsd/dev/sweet_usb.c 'SWEET USB IRQ: FAILED'
            require_marker xnu/bsd/dev/sweet_touch_tcm.c 'SWEET TOUCH IRQ: FAILED'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiInterruptMux.cpp 'SWEET_LOG_ERROR'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiInterruptMux.cpp 'SWEET MUX: consumer attached group='
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'SWEET BATT IRQ: armed mode='
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'SWEET BATT DIAG READ: sid=%u addr=%#x error=%d; value=unknown'
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'config-valid=%#x/0x7f'
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'smb-sel=%d read-ok=%#x/0x3'
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'logChargeDiagnostics(state);'
            require_marker xnu/bsd/dev/sweet_spmi.c 'sweet_spmi_irq_lock(void)'
            require_marker xnu/bsd/dev/sweet_spmi.c 'sp_get_lock(void)'
            require_marker xnu/bsd/dev/sweet_spmi.h 'sweet_spmi_charger_update(unsigned sid'
            require_marker xnu/bsd/dev/sweet_spmi.c 'sweet_spmi_rw_poison_locked(route.apid);'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiInterruptMux.cpp 'sweet_spmi_rw_poisoned_locked(route.apid)'
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'SWEET CHARGER PREFLIGHT: restricted transport v1'
            require_marker xnu/bsd/dev/sweet_spmi.c 'sweet_spmi_fg_read(unsigned field'
            require_marker xnu/bsd/dev/sweet_spmi.c 'SWEET FG ACCESS: v2 field='
            require_marker xnu/bsd/dev/sweet_charger.c 'sweet_charger_execute(enum sweet_charger_operation'
            require_marker xnu/bsd/dev/sweet_charger.c 'ns >= deadline'
            require_marker xnu/bsd/dev/sweet_battery_runtime.h 'SWEET_CHARGER_INPUT_LIMIT_MA'
            require_marker xnu/bsd/conf/files 'bsd/dev/sweet_charger.c'
            require_marker xnu/iokit/conf/files.arm64 'iokit/Kernel/arm/SweetPmicPower.cpp'
            require_marker xnu/iokit/Kernel/arm/SweetPmicPower.cpp 'sweet_pmic_power_read_snapshot(SweetBattSnapshot'
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'SWEET BATT HARDWARE: v1 semantic charger operations'
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'SWEET ADC5 PREFLIGHT: v1'
            require_marker xnu/bsd/dev/sweet_spmi.c 'sweet_spmi_adc5_inspect(struct sweet_adc5_preflight'
            require_marker xnu/bsd/dev/sweet_spmi.c 'sp_fg_dma_command_locked(unsigned apid'
            require_marker xnu/bsd/dev/sweet_spmi.c 'SWEET FG DMA: v3 phase=recovery'
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'SWEET BATT SAMPLE: v2 id='
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'SWEET BATT TIME: v3 id='
            require_marker xnu/bsd/dev/sweet_spmi.c 'sp_fg_require_writer(&session, 0x4340)'
            require_marker xnu/bsd/dev/sweet_spmi.c 'sp_find_apid(0x200u | (addr >> 8))'
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'SWEET BATT CONFIG: v3 id='
            require_marker xnu/bsd/dev/sweet_battery_runtime.h 'sb_decide(SweetBattController'
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'SWEET BATT RUNTIME: v1 mode='
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'registerPrioritySleepWakeInterest(runtimePowerNotice, this)'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiMuxClient.cpp 'pending & SWEET_BATT_IRQ_ALL'
            require_marker xnu/bsd/dev/sweet_spmi_mux.h 'SWEET_BATT_IRQ_SOURCE'
            require_marker xnu/bsd/dev/sweet_keys.c 'sweet_spmi_irq_lock();'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiInterruptMux.cpp 'SWEET MUX: controller transactions serialized across keys and battery'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiInterruptMux.cpp 'SWEET MUX: isolated group=%u; other groups remain available'
            require_marker xnu/bsd/dev/sweet_log_level.h 'ERROR is unconditional; severity filtering must never hide a failure.'
            require_marker xnu/bsd/dev/sweet_spmi_mux.h 'SWEET_BATT_IRQ_MSOC'
            require_marker xnu/bsd/dev/sweet_spmi_mux.h 'SWEET_MUX_READY'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiMuxClient.cpp 'gIOFirstMatchNotification'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiMuxClient.cpp 'gIOTerminatedNotification'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiMuxClient.cpp 'mux->attachConsumer(owner, group, events'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiMuxClient.cpp 'mux->detachConsumer(owner, group, this)'
            require_marker xnu/iokit/Kernel/arm/SweetBattery.cpp 'SWEET BATT IRQ: waiting for mux registry match; no timer/status polling'
            require_marker xnu/bsd/dev/sweet_board.c 'SWEET BOARD: late init before root lookup; independent of UFS'
            require_marker xnu/bsd/kern/bsd_init.c 'sweet_board_init();'
            require_marker xnu/bsd/conf/files 'bsd/dev/sweet_board.c'
            require_marker xnu/iokit/Kernel/arm/SweetPmicKeys.cpp 'class SweetPmicKeys : public IOService'
            require_marker xnu/iokit/conf/files.arm64 'iokit/Kernel/arm/SweetSpmiMuxClient.cpp'
            require_marker xnu/iokit/conf/files.arm64 'iokit/Kernel/arm/SweetPmicKeys.cpp'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiInterruptMux.cpp 'SWEET MUX: infrastructure ready intid='
            require_marker xnu/bsd/dev/sweet_spmi_mux.h 'class SweetSpmiInterruptMux : public IOService'
            require_marker xnu/bsd/dev/sweet_spmi_mux.h 'attachConsumer(IOService *consumer'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiInterruptMux.cpp 'SWEET MUX: IOService started; owns workloop, routes and MMIO'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiInterruptMux.cpp 'ml_io_map_unmappable(physical, size, VM_WIMG_IO)'
            require_marker xnu/iokit/Kernel/arm/SweetSpmiInterruptMux.cpp 'nub->registerService(kIOServiceSynchronous)'
            require_marker xnu/iokit/KernelConfigTables.cpp "'IOProviderClass' = SweetSpmiMuxDevice;"
            require_marker xnu/iokit/KernelConfigTables.cpp "'IOProviderClass' = SweetPmicKeysDevice;"
            if grep -Eq '0x(1042|1043|1061|1070|1340|1342|1365|1366|1370)' xnu/bsd/dev/sweet_battery_runtime.h; then
              echo 'ERROR: register-address control survived semantic charger interface' >&2
              exit 1
            fi
            # An applied board wrapper is insufficient if the old edges survived.
            if grep -Eq 'sweet_(keys_init|touch_init|usb_probe|sample_start|display_probe_init|gpu_init|board_init|spmi_mux_start)' xnu/bsd/dev/sweet_ufs.c ||
               grep -Fq 'sweet_spmi_mux_start' xnu/bsd/dev/sweet_keys.c ||
               grep -Fq 'sweet_keys_' xnu/iokit/Kernel/arm/SweetSpmiInterruptMux.cpp; then
              echo 'ERROR: stale UFS/device or keys/mux startup dependency remains' >&2
              exit 1
            fi
            if grep -Eq 'muxService|readyLock|publishReadiness|sweet_spmi_mux_(attach|detach|watch_ready|unwatch_ready)' xnu/iokit/Kernel/arm/SweetSpmiInterruptMux.cpp xnu/bsd/dev/sweet_spmi_mux.h xnu/iokit/Kernel/arm/SweetBattery.cpp xnu/bsd/dev/sweet_keys.c; then
              echo 'ERROR: global mux consumer bridge survived 0145' >&2
              exit 1
            fi

      # ── 以下步骤对应 if: always()，使用 when: always ──

      - run:
          name: Package build tree for local compiles
          when: always
          command: |
            SDK=$(xcrun --sdk macosx --show-sdk-path)
            mkdir -p sdk-kernel-platform
            cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
            tar czf buildtree.tgz \
              --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
              --exclude='kernel.development.*' --exclude='.git' \
              -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
              -C .. sdk-kernel-platform
            ls -la buildtree.tgz

      - store_artifacts:   # 对应 actions/upload-artifact（buildtree）
          path: buildtree.tgz
          destination: xnu-buildtree

      - store_artifacts:
          path: build.log
          destination: xnu-build-log

      - run:
          name: Inspect closed KDK support libs
          when: always
          command: |
            mkdir -p out/kdk-libs
            for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
              b=$(basename "$lib" .a)
              ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
              nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
              lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
            done
            ls -la out/kdk-libs

      - run:
          name: Collect
          when: always
          command: |
            mkdir -p out
            cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
            ls -la out
            (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
            tar czf kernel-out.tgz -C out .
            ls -la kernel-out.tgz

      - store_artifacts:   # 对应 actions/upload-artifact（kernel）
          path: kernel-out.tgz
          destination: xnu-kernel

workflows:
  # 对应 push to main（paths filter 需在 Project Settings > Advanced 中配置）
  build-on-push:
    jobs:
      - build

  # 对应 workflow_dispatch：通过 CircleCI API 手动触发并传入参数
  # curl -X POST https://circleci.com/api/v2/project/{project-slug}/pipeline \
  #   -H "Circle-Token: <your-token>" \
  #   -H "Content-Type: application/json" \
  #   -d '{"parameters": {"macos_version": "13.5", "kernel_config": "RELEASE", "machine_config": "MH2LM", "keep_going": true}}'
